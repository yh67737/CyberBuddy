# CyberBuddy 基础设施 — PostgreSQL + Milvus 向量数据库
#
# 启动: docker compose up -d
# 停止: docker compose down
# 清数据: docker compose down -v
#
# 端口:
#   5432  — PostgreSQL
#   19530 — Milvus gRPC
#   9091  — Milvus metrics
#   2379  — etcd (Milvus 元数据)
#   9000  — MinIO API (Milvus 对象存储)
#   9001  — MinIO Console

version: "3.8"

services:
  # =========================================================================
  # PostgreSQL — 关系型数据库，存储用户/会话/消息/事件/使用日志
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cyberbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyberbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberbuddy"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================================================
  # etcd — Milvus 元数据存储
  # =========================================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: cyberbuddy-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # MinIO — Milvus 对象存储（向量索引 + 原始数据）
  # =========================================================================
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: cyberbuddy-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Milvus Standalone — 向量数据库
  # =========================================================================
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: cyberbuddy-milvus
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    command: milvus run standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =========================================================================
  # Backend — FastAPI + Uvicorn (6-Agent LangGraph pipeline)
  # =========================================================================
  backend:
    build:
      context: ./backend
    container_name: cyberbuddy-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override localhost defaults so the container reaches in-network services
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyberbuddy
      MILVUS_HOST: milvus
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/models          # BGE embedding model cache (~1.3 GB, survives rebuilds)
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================================
  # Frontend — Next.js standalone (user portal + SecOps dashboard)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      # For non-localhost deployment, pass the public API/WS URLs:
      #   --build-arg NEXT_PUBLIC_API_URL=https://api.example.com
      #   --build-arg NEXT_PUBLIC_WS_URL=wss://api.example.com
    container_name: cyberbuddy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  etcd_data:
  minio_data:
  milvus_data:
  hf_cache:
